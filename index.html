<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iconoclast Handshapes</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="landing-page">
    <video autoplay muted loop playsinline class="bg-video">
        <source src="videos/ocn.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <div class="landing-container">
        <img src="images/logojpeg.svg" alt="Iconoclast Handshapes Logo" class="landing-logo">
        <p class="landing-caption">Custom Surfboards by Mike Wallace</p>
        <nav class="landing-nav">
            <a href="home.html">Enter</a>
        </nav>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.querySelector('.bg-video');

            video.addEventListener('loadeddata', () => {
                console.log('Video loaded successfully');
            });

            video.addEventListener('error', (e) => {
                console.error('Error loading video:', e);
            });
        });
    </script>
</body>
</html>
